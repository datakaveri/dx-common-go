# CI for dx-common-go — the shared foundation every dx Go service depends on.
# Replicate this workflow in each service repo (dx-authz-go, dx-acl-go, …); they
# all carry the same .golangci.yml so the fleet enforces one quality bar.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  # The depguard rules in .golangci.yml are not style — they are how the
  # platform's layering and driver containment are enforced. A violation must
  # fail the build, not appear in a review comment.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: golangci-lint
        # action v7+ is required for the v2 config format .golangci.yml uses.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  # The examples/ module is a separate Go module (its own go.mod), so the
  # parent build above never touches it. Compiling it here is what keeps the
  # reference wiring in examples/minimal-service from rotting as the framework
  # evolves — a breaking API change that isn't reflected in the template fails
  # this job.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Build + vet examples module
        working-directory: examples
        run: |
          go build ./...
          go vet ./...
